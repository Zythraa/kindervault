services:
  - type: web
    name: kindervault
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SCANNER_ENABLED
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
