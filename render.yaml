services:
  - type: web
    name: kindervault
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SCANNER_ENABLED
        value: "false"
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: kindervault
      - key: DB_USER
        value: 3tg1mCiMFrW8c7z.root
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_ENABLED
        value: "true"
      - key: DB_SSL_CA
        value: /etc/secrets/tidb-ca.pem
      - key: MFA_ENCRYPTION_KEY
        sync: false
